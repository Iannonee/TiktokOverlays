<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility; }
html, body { width:100%; height:100%; overflow:hidden; background:#050505; }
.screen { width:100%; height:100%; background:#050505; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed',sans-serif; }
canvas { position:absolute; inset:0; width:100%; height:100%; }
.scanlines { position:absolute; inset:0; background:repeating-linear-gradient(to bottom,transparent,transparent 3px,rgba(0,0,0,0.05) 3px,rgba(0,0,0,0.05) 4px); pointer-events:none; z-index:8; }
.edge-top { position:absolute; top:0; left:0; right:0; height:4px; background:linear-gradient(to right,transparent,#CC1010,transparent); z-index:20; }
.edge-bottom { position:absolute; bottom:0; left:0; right:0; height:4px; background:linear-gradient(to right,transparent,#CC1010,transparent); z-index:20; }
.edge-left { position:absolute; left:0; top:5%; bottom:5%; width:4px; background:linear-gradient(to bottom,transparent,#CC1010 30%,#CC1010 70%,transparent); z-index:20; }
.edge-right { position:absolute; right:0; top:5%; bottom:5%; width:4px; background:linear-gradient(to bottom,transparent,#CC1010 30%,#CC1010 70%,transparent); z-index:20; }
.corner { position:absolute; width:60px; height:60px; z-index:20; }
.c-tl { top:20px; left:20px; border-top:3px solid #CC1010; border-left:3px solid #CC1010; }
.c-tr { top:20px; right:20px; border-top:3px solid #CC1010; border-right:3px solid #CC1010; }
.c-bl { bottom:20px; left:20px; border-bottom:3px solid #CC1010; border-left:3px solid #CC1010; }
.c-br { bottom:20px; right:20px; border-bottom:3px solid #CC1010; border-right:3px solid #CC1010; }
.content { position:relative; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:space-between; text-align:center; width:100%; height:100%; padding:15vh 0 10vh 0; }
.logo-img { width:280px; height:220px; object-fit:contain; filter:drop-shadow(0 0 40px rgba(204,16,16,0.7)); }
.text-container { display:flex; flex-direction:column; align-items:center; }
.tag { font-size:24px; font-weight:400; letter-spacing:12px; color:#CC1010; text-transform:uppercase; margin-bottom:20px; }
.name { font-family:'Bebas Neue',sans-serif; font-size:130px; line-height:0.88; color:#fff; letter-spacing:6px; margin-bottom:24px; }
.name .red { color:#CC1010; }
.divider { width:120px; height:3px; background:#CC1010; margin:0 auto 30px; }
.status { font-family:'Bebas Neue',sans-serif; font-size:56px; color:#fff; letter-spacing:14px; }
.sub { font-weight:300; font-size:20px; letter-spacing:7px; color:#444; text-transform:uppercase; margin-top:18px; }
.socials { display:flex; align-items:center; gap:35px; }
.social-item { display:flex; align-items:center; gap:12px; }
.social-icon { width:44px; height:44px; border:1.5px solid rgba(204,16,16,0.4); display:flex; align-items:center; justify-content:center; }
.social-icon svg { width:22px; height:22px; fill:#CC1010; }
.social-name { font-size:18px; letter-spacing:3px; color:#666; text-transform:uppercase; }
.sep { width:1px; height:30px; background:rgba(204,16,16,0.3); }
.corner-label { position:absolute; bottom:30px; right:50px; font-size:18px; letter-spacing:4px; color:#222; text-transform:uppercase; z-index:20; }
</style>
</head>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
