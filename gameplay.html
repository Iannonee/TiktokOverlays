<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility; }
html, body { width:1080px; height:1920px; overflow:hidden; background:transparent; }
.screen {
  width:1080px;
  height:1920px;
  position:absolute;
  top:0; left:0;
  background:transparent;
  overflow:hidden;
}
.edge-top { position:absolute; top:0; left:0; right:0; height:4px; background:linear-gradient(to right,transparent,#CC1010,transparent); z-index:20; }
.edge-bottom { position:absolute; bottom:0; left:0; right:0; height:4px; background:linear-gradient(to right,transparent,#CC1010,transparent); z-index:20; }
.edge-left { position:absolute; left:0; top:10%; bottom:10%; width:4px; background:linear-gradient(to bottom,transparent,#CC1010 30%,#CC1010 70%,transparent); z-index:20; }
.edge-right { position:absolute; right:0; top:10%; bottom:10%; width:4px; background:linear-gradient(to bottom,transparent,#CC1010 30%,#CC1010 70%,transparent); z-index:20; }
.corner { position:absolute; width:60px; height:60px; z-index:20; }
.c-tl { top:20px; left:20px; border-top:3px solid #CC1010; border-left:3px solid #CC1010; }
.c-tr { top:20px; right:20px; border-top:3px solid #CC1010; border-right:3px solid #CC1010; }
.c-bl { bottom:20px; left:20px; border-bottom:3px solid #CC1010; border-left:3px solid #CC1010; }
.c-br { bottom:20px; right:20px; border-bottom:3px solid #CC1010; border-right:3px solid #CC1010; }
.tick { position:absolute; background:#CC1010; z-index:20; opacity:0.6; }
.tk-t1 { top:4px; left:25%; width:2px; height:10px; }
.tk-t2 { top:4px; left:75%; width:2px; height:10px; }
.tk-b1 { bottom:4px; left:25%; width:2px; height:10px; }
.tk-b2 { bottom:4px; left:75%; width:2px; height:10px; }
.logo-top { position:absolute; top:28px; left:40px; z-index:10; }
.logo-top img { width:90px; height:90px; object-fit:contain; image-rendering:high-quality; filter:drop-shadow(0 0 12px rgba(204,16,16,0.5)); }
.top-block { position:absolute; top:46px; left:0; right:0; display:flex; justify-content:center; z-index:10; }
.live-badge { display:flex; align-items:center; gap:10px; }
.live-dot { width:10px; height:10px; border-radius:50%; background:#CC1010; animation:blink 1.5s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
.live-text { font-family:'Barlow Condensed',sans-serif; font-size:22px; letter-spacing:10px; color:#CC1010; text-transform:uppercase; }
.bottom-block { position:absolute; bottom:40px; left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:18px; z-index:10; }
.channel-name { font-family:'Bebas Neue',sans-serif; font-size:90px; color:#fff; letter-spacing:6px; line-height:1; }
.channel-name span { color:#CC1010; }
.socials-row { display:flex; align-items:center; gap:40px; }
.social-item { display:flex; align-items:center; gap:10px; }
.social-icon { width:40px; height:40px; border:1.5px solid rgba(204,16,16,0.4); display:flex; align-items:center; justify-content:center; }
.social-icon svg { width:20px; height:20px; fill:#CC1010; }
.social-name { font-family:'Barlow Condensed',sans-serif; font-size:20px; letter-spacing:3px; color:#666; text-transform:uppercase; }
.sep { width:1px; height:28px; background:rgba(204,16,16,0.3); }
</style>
</head>
